<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paylink 代理配置</title>
    <link rel="stylesheet" href="/assets/settings.css?v=20260809-ui1" />
    <link rel="stylesheet" href="/assets/app-shell.css?v=20260810-shell8" />
    <script defer src="/assets/app-shell.js?v=20260810-shell8"></script>
    <script defer src="/assets/settings.js?v=20260809-stages4"></script>
  </head>
  <body class="settings-page">
    <main class="settings-page__main">
      <header class="settings-page__header">
        <p class="settings-page__eyebrow">代理池</p>
        <h1 id="providerTitle">加载配置</h1>
      </header>

      <form id="proxyConfigForm" class="proxy-config" novalidate>
        <section id="paypalProfileSection" class="proxy-config__section" hidden aria-labelledby="paypalProfileHeading">
          <div class="proxy-config__section-header">
            <div>
              <h2 id="paypalProfileHeading">PayPal 账单 Profile</h2>
              <p id="paypalProfileState" class="proxy-config__meta">-</p>
            </div>
          </div>
          <div class="proxy-config__profile-grid">
            <label class="proxy-config__label" for="paypalCountry">账单地区</label>
            <select id="paypalCountry" name="paypalCountry"></select>
            <label class="proxy-config__label" for="paypalLocale">支付语言</label>
            <select id="paypalLocale" name="paypalLocale"></select>
            <button id="saveProfileButton" class="proxy-config__secondary" type="button">应用 Profile</button>
          </div>
        </section>

        <div id="stageConfigList" class="proxy-config__stages" aria-live="polite"></div>

        <p id="formStatus" class="proxy-config__status" role="status" aria-live="polite">加载中...</p>
      </form>
    </main>
  </body>
</html>
